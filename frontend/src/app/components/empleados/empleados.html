<div class="container" style="margin-top: 30px;">
  <div class="row">
    <!-- Formulario de Registro / Edición -->
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Gestión de Empleados</h5>
          <form #empleadoForm="ngForm" (ngSubmit)="addEmpleado(empleadoForm)">
            
            <input type="hidden" name="_id" [(ngModel)]="empleadoService.selectedEmpleado._id">

            <div class="mb-3">
              <label class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" name="name" [(ngModel)]="empleadoService.selectedEmpleado.name" placeholder="Ej: Santiago" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Cargo</label>
              <input type="text" class="form-control" name="position" [(ngModel)]="empleadoService.selectedEmpleado.position" placeholder="Ej: Desarrollador" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Oficina</label>
              <input type="text" class="form-control" name="office" [(ngModel)]="empleadoService.selectedEmpleado.office" placeholder="Ej: Bogotá" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Salario</label>
              <input type="number" class="form-control" name="salary" [(ngModel)]="empleadoService.selectedEmpleado.salary" placeholder="Ej: 3500000" required>
            </div>

            <button class="btn btn-primary me-2" type="submit">Guardar</button>
            <button class="btn btn-secondary" type="button" (click)="resetForm(empleadoForm)">Limpiar</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Tabla con Lista de Empleados -->
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Lista de Empleados</h5>
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Nombre</th>
                <th>Cargo</th>
                <th>Oficina</th>
                <th>Salario</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let empleado of empleadoService.empleados">
                <td>{{ empleado.name }}</td>
                <td>{{ empleado.position }}</td>
                <td>{{ empleado.office }}</td>
                <td>{{ empleado.salary | currency:'USD':'symbol':'1.0-0' }}</td>
                <td>
                  <button class="btn btn-warning btn-sm me-1" (click)="editEmpleado(empleado)">Editar</button>
                  <button class="btn btn-danger btn-sm" (click)="deleteEmpleado(empleado._id)">Eliminar</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
